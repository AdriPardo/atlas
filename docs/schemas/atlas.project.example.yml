# Atlas project manifest — sketch (ADR-0014)
# Canonical filename in repo: atlas.yml  (alias: atlas.project.yml)
# Status: phase C+ — deploy reads runtime.composeFile + optional runtime.migrateCommand;
#   Service.composePath optional / synthesized fallback.

apiVersion: atlas/v1alpha1
kind: Project

metadata:
  name: example-app

runtime:
  # compose (default) | podman-compose (opt-in; host capability podman) | k8s | systemd | custom
  kind: compose
  # Migration bridge: existing docker-compose.atlas.yml / composePath
  # For kind podman-compose Atlas runs `podman compose` against the same composeFile.
  composeFile: docker-compose.atlas.yml
  # Optional. Atlas runs this shell command after stack apply (cwd = clone workspace).
  # App owns the migrator (Prisma / Flyway / etc.). Omit if the container already migrates on start.
  # See docs/deployment/app-migrations.md
  migrateCommand: npm run db:migrate:deploy
  # Optional. Inject project secrets into workspace .env before compose (ADR-0015 / ADR-0017).
  # Create secrets in Atlas UI (Project → Secrets); reference them here. Redeploy to materialize.
  # db.url → DATABASE_URL; ai.openai → OPENAI_API_KEY; other names → SCREAMING_SNAKE.
  # Override with env: / as:
  envFrom:
    - secretRef: db.url
    # User-owned app keys (examples — create matching secrets in Atlas first):
    - secretRef: ai.openai            # → OPENAI_API_KEY
    - secretRef: ai.elevenlabs        # → ELEVENLABS_API_KEY
    # - secretRef: stripe.secret      # → STRIPE_SECRET
    # - secretRef: ai.openai.base_url # → OPENAI_BASE_URL
    # - secretRef: custom.key
    #   env: MY_CUSTOM_ENV

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      port: 8080
      protocol: http
    health:
      path: /actuator/health
      intervalSeconds: 15
    envFrom:
      # Prefer db.url (full DATABASE_URL). db.password = legacy split credentials.
      # Merged with runtime.envFrom (runtime wins on same env key).
      - secretRef: db.schema
      - configKey: DOMAIN

  web:
    image: ghcr.io/example/web:latest
    expose:
      port: 80
      protocol: http
    dependsOn:
      - api
    health:
      path: /
      intervalSeconds: 30

# Autopilot may override at deploy time (PUBLIC | INTERNAL).
# ADR-0016: PUBLIC apps — production minify hint + TLS at edge (HTTPS), not payload crypto.
build:
  # Default true when omitted. Deploy ensures NODE_ENV=production in workspace .env.
  minify: true

exposure:
  default: public
  # Default true when omitted. PUBLIC path uses Traefik websecure + Tunnel HTTPS.
  requireTls: true
