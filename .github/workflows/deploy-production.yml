name: Deploy production (Atlas self)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: atlas-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production VM
    # Self-hosted runner required: production host is on a private LAN.
    # Label the runner: self-hosted, Linux, atlas-prod
    runs-on: [self-hosted, Linux, atlas-prod]
    timeout-minutes: 45

    steps:
      - name: Check required path / secrets
        id: mode
        env:
          ATLAS_DEPLOY_HOST: ${{ secrets.ATLAS_DEPLOY_HOST || secrets.DEPLOY_HOST }}
          ATLAS_DEPLOY_USER: ${{ secrets.ATLAS_DEPLOY_USER || secrets.DEPLOY_USER }}
          ATLAS_DEPLOY_SSH_KEY: ${{ secrets.ATLAS_DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          ATLAS_DEPLOY_PATH: ${{ secrets.ATLAS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          APP_DIR="${ATLAS_DEPLOY_PATH:-/opt/atlas/atlas}"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

          # Runner on the same VM (dogfood): deploy locally — no SSH hop.
          if [ -x "$APP_DIR/scripts/deploy.sh" ] || [ -x "$APP_DIR/scripts/deploy-vm.sh" ]; then
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "Deploy mode: local (found deploy script under $APP_DIR)"
            exit 0
          fi

          echo "mode=ssh" >> "$GITHUB_OUTPUT"
          echo "Deploy mode: SSH (no local deploy script at $APP_DIR)"
          missing=0
          for name in ATLAS_DEPLOY_HOST ATLAS_DEPLOY_USER ATLAS_DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name (or DEPLOY_* alias) — see docs/deployment/cicd-atlas-self.md"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare SSH
        if: steps.mode.outputs.mode == 'ssh'
        env:
          ATLAS_DEPLOY_HOST: ${{ secrets.ATLAS_DEPLOY_HOST || secrets.DEPLOY_HOST }}
          ATLAS_DEPLOY_SSH_KEY: ${{ secrets.ATLAS_DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          ATLAS_DEPLOY_KNOWN_HOSTS: ${{ secrets.ATLAS_DEPLOY_KNOWN_HOSTS }}
        run: |
          # Use a dedicated known_hosts file — never overwrite ~/.ssh/known_hosts
          # (runner may share the deploy user home on the same VM).
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$ATLAS_DEPLOY_SSH_KEY" > ~/.ssh/atlas_deploy
          chmod 600 ~/.ssh/atlas_deploy
          KH=~/.ssh/atlas_deploy_known_hosts
          if [ -n "${ATLAS_DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$ATLAS_DEPLOY_KNOWN_HOSTS" > "$KH"
          else
            ssh-keyscan -T 10 -H "$ATLAS_DEPLOY_HOST" > "$KH" 2>/dev/null \
              || echo "::warning::ssh-keyscan failed; set secret ATLAS_DEPLOY_KNOWN_HOSTS"
          fi
          chmod 644 "$KH"

      - name: Deploy locally on runner VM
        if: steps.mode.outputs.mode == 'local'
        env:
          ATLAS_DEPLOY_PATH: ${{ secrets.ATLAS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          APP_DIR="${ATLAS_DEPLOY_PATH:-/opt/atlas/atlas}"
          export ATLAS_APP_DIR="$APP_DIR"
          cd "$APP_DIR"
          if [ -x scripts/deploy.sh ]; then
            exec bash scripts/deploy.sh
          fi
          if [ -x scripts/deploy-vm.sh ]; then
            exec bash scripts/deploy-vm.sh
          fi
          echo "::error::Missing executable scripts/deploy.sh under $APP_DIR"
          exit 1

      - name: Deploy over SSH
        if: steps.mode.outputs.mode == 'ssh'
        env:
          ATLAS_DEPLOY_HOST: ${{ secrets.ATLAS_DEPLOY_HOST || secrets.DEPLOY_HOST }}
          ATLAS_DEPLOY_USER: ${{ secrets.ATLAS_DEPLOY_USER || secrets.DEPLOY_USER }}
          ATLAS_DEPLOY_PATH: ${{ secrets.ATLAS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          REMOTE_PATH="${ATLAS_DEPLOY_PATH:-/opt/atlas/atlas}"
          set +e
          ssh -i ~/.ssh/atlas_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/atlas_deploy_known_hosts \
            "${ATLAS_DEPLOY_USER}@${ATLAS_DEPLOY_HOST}" \
            "export ATLAS_APP_DIR='${REMOTE_PATH}'; cd \"\${ATLAS_APP_DIR}\"; if [ -x scripts/deploy.sh ]; then exec bash scripts/deploy.sh; elif [ -x scripts/deploy-vm.sh ]; then exec bash scripts/deploy-vm.sh; fi; echo '::error::Missing scripts/deploy.sh on VM — pull master once manually'; exit 1"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::SSH deploy failed (exit $rc). Host unreachable from runner (often 'No route to host'). Fix ATLAS_DEPLOY_HOST to a LAN IP reachable from the self-hosted runner, or install the runner on the VM so local deploy mode can use $REMOTE_PATH. See docs/deployment/cicd-atlas-self.md"
            exit "$rc"
          fi

      - name: Cleanup SSH key
        if: always() && steps.mode.outputs.mode == 'ssh'
        run: rm -f ~/.ssh/atlas_deploy
