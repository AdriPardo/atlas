name: Deploy appClub via Atlas API

on:
  workflow_dispatch:

concurrency:
  group: appclub-atlas-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy appClub on Atlas host
    runs-on: [self-hosted, Linux, atlas-prod]
    timeout-minutes: 30
    steps:
      - name: Trigger Atlas DEPLOY_SERVICE and wait SUCCEEDED
        env:
          PROJECT_ID: af602941-e589-4e1c-bf9d-e762a1ecbcce
        run: |
          set -euo pipefail
          ENV_FILE="${ATLAS_ENV_FILE:-/opt/atlas/atlas/.env}"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Missing $ENV_FILE"
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          source "$ENV_FILE"
          set +a

          API=""
          for base in http://127.0.0.1:8080 http://192.168.1.24:8080 http://192.168.1.35:8080; do
            if curl -sf --connect-timeout 2 "$base/actuator/health" >/dev/null 2>&1 \
              || curl -sf --connect-timeout 2 "$base/api/v1/health" >/dev/null 2>&1; then
              API="$base"
              break
            fi
          done
          if [ -z "$API" ]; then
            echo "::error::Atlas API not reachable on localhost/LAN :8080"
            exit 1
          fi
          echo "API=$API"

          LOGIN=$(curl -sS -X POST "$API/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${ATLAS_ADMIN_USERNAME}\",\"password\":\"${ATLAS_ADMIN_PASSWORD}\"}")
          TOKEN=$(printf '%s' "$LOGIN" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("accessToken") or d.get("token") or "")')
          if [ -z "$TOKEN" ]; then
            echo "::error::Atlas login failed"
            printf '%s\n' "$LOGIN" | head -c 200
            exit 1
          fi
          echo "login OK"

          DEPLOY=$(curl -sS -X POST "$API/api/v1/projects/${PROJECT_ID}/deploy" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"exposure":"PUBLIC","placementMode":"SHARED"}')
          echo "$DEPLOY"
          JOB_ID=$(printf '%s' "$DEPLOY" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("jobId",""))')
          DEPLOYMENT_ID=$(printf '%s' "$DEPLOY" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("deploymentId",""))')
          if [ -z "$JOB_ID" ]; then
            echo "::error::No jobId in deploy response"
            exit 1
          fi
          echo "JOB_ID=$JOB_ID DEPLOYMENT_ID=$DEPLOYMENT_ID"

          FINAL=""
          for i in $(seq 1 90); do
            JOB=$(curl -sS "$API/api/v1/jobs/$JOB_ID" -H "Authorization: Bearer $TOKEN")
            ST=$(printf '%s' "$JOB" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))')
            echo "poll $i status=$ST"
            case "$ST" in
              SUCCEEDED|FAILED|CANCELLED)
                FINAL="$ST"
                printf '%s\n' "$JOB" | python3 -c 'import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ["id","status","type","lastError","finishedAt"]})'
                break
                ;;
            esac
            sleep 10
          done
          if [ "$FINAL" != "SUCCEEDED" ]; then
            echo "::error::Deploy ended with status=${FINAL:-TIMEOUT}"
            if [ -n "${DEPLOYMENT_ID:-}" ]; then
              curl -sS "$API/api/v1/deployments/$DEPLOYMENT_ID" -H "Authorization: Bearer $TOKEN" | tail -c 2000 || true
            fi
            exit 1
          fi
          echo "FINAL SUCCEEDED"