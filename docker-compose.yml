services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      # Host port overridable when 5432 is already taken locally
      - "${ATLAS_DB_HOST_PORT:-5432}:5432"
    volumes:
      - atlas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ATLAS_DB_URL: jdbc:postgresql://postgres:5432/atlas
      ATLAS_DB_USERNAME: atlas
      ATLAS_DB_PASSWORD: atlas
      ATLAS_WORKER_ENABLED: ${ATLAS_WORKER_ENABLED:-true}
      ATLAS_WORKSPACE_DIR: /var/lib/atlas/workspaces
    ports:
      - "8080:8080"
    volumes:
      - atlas_workspaces:/var/lib/atlas/workspaces
      # SECURITY: mounting the Docker socket lets Atlas LOCAL hosts control the host engine.
      # Uncomment only on trusted single-tenant installs when you want in-place compose deploys.
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
      - internal

volumes:
  atlas_pg_data:
  atlas_workspaces:

networks:
  public:
    external: true
    name: atlas-public

  internal:
    external: true
    name: atlas-internal
