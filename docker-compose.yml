services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ATLAS_DB_URL: jdbc:postgresql://postgres:5432/atlas
      ATLAS_DB_USER: atlas
      ATLAS_DB_PASSWORD: atlas
      ATLAS_JWT_SECRET: change-me-change-me-change-me-change-me-32b
      ATLAS_JWT_EXPIRATION_MINUTES: "480"
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  atlas_pg_data:
