services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      # Host port overridable when 5432 is already taken locally
      - "${ATLAS_DB_HOST_PORT:-5432}:5432"
    volumes:
      - atlas_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-apps-db.sql:/docker-entrypoint-initdb.d/01-apps.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Own MTA (ADR-0018). Apps + Atlas control plane dial hostname "smtp".
  # Local default: relay into Mailpit so nothing leaves the LAN.
  # Prod: set ATLAS_SMTP_RELAYHOST empty (direct MX) or to SES/SendGrid.
  smtp:
    image: boky/postfix:latest
    environment:
      ALLOWED_SENDER_DOMAINS: ${ATLAS_APP_SMTP_FROM_DOMAIN:-mail.atlas.local}
      HOSTNAME: smtp.${ATLAS_APP_SMTP_FROM_DOMAIN:-mail.atlas.local}
      # Bracket form required for non-standard ports (Mailpit 1025).
      RELAYHOST: ${ATLAS_SMTP_RELAYHOST:-[mailpit]:1025}
      POSTFIX_inet_protocols: ipv4
    ports:
      - "${ATLAS_SMTP_HOST_PORT:-2525}:25"
    depends_on:
      - mailpit
    networks:
      - internal
    restart: unless-stopped

  # Catch-all UI for local/dev (Postfix relays here by default).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${ATLAS_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${ATLAS_MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ATLAS_DB_URL: jdbc:postgresql://postgres:5432/atlas
      ATLAS_DB_USERNAME: atlas
      ATLAS_DB_PASSWORD: atlas
      # ADR-0015: customer schemas (never the control-plane "atlas" DB)
      ATLAS_APP_DB_URL: jdbc:postgresql://postgres:5432/apps
      ATLAS_APP_DB_USERNAME: atlas
      ATLAS_APP_DB_PASSWORD: atlas
      # ADR-0018: own Postfix on atlas-internal
      ATLAS_APP_SMTP_HOST: smtp
      ATLAS_APP_SMTP_PORT: 25
      ATLAS_APP_SMTP_FROM_DOMAIN: ${ATLAS_APP_SMTP_FROM_DOMAIN:-mail.atlas.local}
      ATLAS_APP_SMTP_TLS: "false"
      ATLAS_APP_SMTP_AUTH: "false"
      ATLAS_APP_SMTP_AUTO_INJECT: "true"
      ATLAS_WORKER_ENABLED: ${ATLAS_WORKER_ENABLED:-true}
      ATLAS_WORKSPACE_DIR: /var/lib/atlas/workspaces
      ATLAS_BACKUP_DIR: /var/lib/atlas/backups
    ports:
      - "8080:8080"
    volumes:
      - atlas_workspaces:/var/lib/atlas/workspaces
      - atlas_backups:/var/lib/atlas/backups
      # SECURITY: mounting the Docker socket lets Atlas LOCAL hosts control the host engine.
      # Uncomment only on trusted single-tenant installs when you want in-place compose deploys.
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      smtp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        # Prefer service_started so slow backend boot does not abort compose up.
        condition: service_started
    networks:
      - public
      - internal

volumes:
  atlas_pg_data:
  atlas_workspaces:
  atlas_backups:

networks:
  public:
    external: true
    name: atlas-public

  internal:
    external: true
    name: atlas-internal
