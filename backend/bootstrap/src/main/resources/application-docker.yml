spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${ATLAS_DB_URL}
    username: ${ATLAS_DB_USERNAME}
    password: ${ATLAS_DB_PASSWORD}

atlas:
  security:
    cors:
      allowed-origins: ${ATLAS_CORS_ORIGINS:http://localhost,https://atlas.atlasops.dev}
    authentik:
      enabled: ${ATLAS_AUTHENTIK_ENABLED:true}
  worker:
    enabled: ${ATLAS_WORKER_ENABLED:true}
  workspace:
    dir: ${ATLAS_WORKSPACE_DIR:/var/lib/atlas/workspaces}
  adapters:
    real-enabled: ${ATLAS_ADAPTERS_REAL_ENABLED:true}
  # Opt-in: set ATLAS_APP_DB_* explicitly (see docker-compose.yml). No silent defaults —
  # wrong password against a missing "apps" DB would report provisionerConfigured=true and 400 on list.
  app-database:
    jdbc-url: ${ATLAS_APP_DB_URL:}
    username: ${ATLAS_APP_DB_USERNAME:}
    password: ${ATLAS_APP_DB_PASSWORD:}
  db-console:
    public-url: ${ATLAS_DB_CONSOLE_URL:}
