spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${ATLAS_DB_URL}
    username: ${ATLAS_DB_USERNAME}
    password: ${ATLAS_DB_PASSWORD}

atlas:
  security:
    cors:
      allowed-origins: ${ATLAS_CORS_ORIGINS:http://localhost,https://atlas.atlasops.dev}
    authentik:
      enabled: ${ATLAS_AUTHENTIK_ENABLED:true}
  worker:
    enabled: ${ATLAS_WORKER_ENABLED:true}
  workspace:
    dir: ${ATLAS_WORKSPACE_DIR:/var/lib/atlas/workspaces}
  adapters:
    real-enabled: ${ATLAS_ADAPTERS_REAL_ENABLED:true}
  # Opt-in: set ATLAS_APP_DB_* explicitly (see docker-compose.yml). No silent defaults —
  # wrong password against a missing "apps" DB would report provisionerConfigured=true and 400 on list.
  app-database:
    jdbc-url: ${ATLAS_APP_DB_URL:}
    username: ${ATLAS_APP_DB_USERNAME:}
    password: ${ATLAS_APP_DB_PASSWORD:}
  db-console:
    public-url: ${ATLAS_DB_CONSOLE_URL:}
    connect-token: ${ATLAS_DB_CONSOLE_CONNECT_TOKEN:}
  app-smtp:
    host: ${ATLAS_APP_SMTP_HOST:}
    app-host: ${ATLAS_APP_SMTP_APP_HOST:}
    port: ${ATLAS_APP_SMTP_PORT:25}
    username: ${ATLAS_APP_SMTP_USERNAME:}
    password: ${ATLAS_APP_SMTP_PASSWORD:}
    from-domain: ${ATLAS_APP_SMTP_FROM_DOMAIN:mail.atlas.local}
    alert-from: ${ATLAS_APP_SMTP_ALERT_FROM:}
    tls: ${ATLAS_APP_SMTP_TLS:false}
    auth: ${ATLAS_APP_SMTP_AUTH:false}
    daily-send-limit-per-project: ${ATLAS_APP_SMTP_DAILY_LIMIT:500}
    auto-inject-on-deploy: ${ATLAS_APP_SMTP_AUTO_INJECT:true}
