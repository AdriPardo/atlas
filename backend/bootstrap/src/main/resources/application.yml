spring:
  application:
    name: atlas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${ATLAS_DB_USERNAME:atlas}
    password: ${ATLAS_DB_PASSWORD:atlas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

atlas:
  security:
    jwt:
      secret: ${ATLAS_JWT_SECRET:change-me-change-me-change-me-change-me-32chars}
      expiration-seconds: ${ATLAS_JWT_EXPIRATION:86400}
    cors:
      allowed-origins: ${ATLAS_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
    admin:
      username: ${ATLAS_ADMIN_USERNAME:admin}
      password: ${ATLAS_ADMIN_PASSWORD:ChangeMe123!}
    authentik:
      # Trust X-authentik-* ForwardAuth headers only when enabled (docker/prod behind Traefik).
      enabled: ${ATLAS_AUTHENTIK_ENABLED:false}
      # Group name substring → ADMIN; everyone else → OPERATOR (Authentik: pipe-separated groups).
      admin-group: ${ATLAS_AUTHENTIK_ADMIN_GROUP:Atlas Admins}
  worker:
    # Same process as API for MVP. Split later with SPRING_PROFILES_ACTIVE=worker + atlas.worker.enabled=true only on worker.
    enabled: ${ATLAS_WORKER_ENABLED:true}
    poll-interval-ms: ${ATLAS_WORKER_POLL_INTERVAL_MS:2000}
    batch-size: ${ATLAS_WORKER_BATCH_SIZE:5}
    id: ${ATLAS_WORKER_ID:atlas-worker}
    # Orphan RUNNING jobs (worker crash / lost lease). Heartbeat refreshes locked_at while executing.
    stale-timeout-seconds: ${ATLAS_JOB_STALE_TIMEOUT:1800}
    heartbeat-interval-seconds: ${ATLAS_JOB_HEARTBEAT_INTERVAL_SECONDS:60}
    stale-reclaim-interval-ms: ${ATLAS_JOB_STALE_RECLAIM_INTERVAL_MS:30000}
  workspace:
    dir: ${ATLAS_WORKSPACE_DIR:${java.io.tmpdir}/atlas-workspaces}
  docker:
    host: ${ATLAS_DOCKER_HOST:}
  secrets:
    master-key: ${ATLAS_SECRETS_MASTER_KEY:}
  adapters:
    real-enabled: ${ATLAS_ADAPTERS_REAL_ENABLED:true}
  observability:
    grafana-base-url: ${ATLAS_GRAFANA_BASE_URL:}
    loki-base-url: ${ATLAS_LOKI_BASE_URL:}
  webhooks:
    rate-limit:
      max-requests: ${ATLAS_WEBHOOK_RATE_MAX:30}
      window-seconds: ${ATLAS_WEBHOOK_RATE_WINDOW_SECONDS:60}
  retention:
    enabled: ${ATLAS_RETENTION_ENABLED:true}
    jobs-days: ${ATLAS_RETENTION_JOBS_DAYS:30}
    pipeline-runs-days: ${ATLAS_RETENTION_PIPELINE_RUNS_DAYS:30}
    cron: ${ATLAS_RETENTION_CRON:0 0 3 * * *}
  backup:
    enabled: ${ATLAS_BACKUP_ENABLED:true}
    dir: ${ATLAS_BACKUP_DIR:/var/lib/atlas/backups}
    keep-count: ${ATLAS_BACKUP_KEEP_COUNT:7}
    cron: ${ATLAS_BACKUP_CRON:0 30 2 * * *}
    pg-dump-binary: ${ATLAS_BACKUP_PG_DUMP_BINARY:pg_dump}
  networking:
    traefik-cert-resolver: ${ATLAS_TRAEFIK_CERT_RESOLVER:letsencrypt}
    traefik-backend-port: ${ATLAS_TRAEFIK_BACKEND_PORT:80}
    cloudflare-account-id: ${ATLAS_CF_ACCOUNT_ID:}
    cloudflare-tunnel-id: ${ATLAS_CF_TUNNEL_ID:}
    cloudflare-zone: ${ATLAS_CF_ZONE:}
    cloudflare-zone-id: ${ATLAS_CF_ZONE_ID:}
    cloudflare-tunnel-origin: ${ATLAS_CF_TUNNEL_ORIGIN:https://traefik:443}
    cloudflare-tunnel-no-tls-verify: ${ATLAS_CF_TUNNEL_NO_TLS_VERIFY:true}
  # Local plan + feature flags (no Stripe). community | enterprise
  plan:
    code: ${ATLAS_PLAN_CODE:community}
  features:
    billing: ${ATLAS_FEATURE_BILLING:true}
    # Blank = on when plan=enterprise. Set true|false to override.
    audit-export: ${ATLAS_FEATURE_AUDIT_EXPORT:}
  # ADR-0015: customer schemas/roles. Must NOT be the control-plane database "atlas".
  app-database:
    jdbc-url: ${ATLAS_APP_DB_URL:}
    username: ${ATLAS_APP_DB_USERNAME:}
    password: ${ATLAS_APP_DB_PASSWORD:}
  # Managed SQL console (pgweb). Must sit behind Authentik; blank disables Open database.
  db-console:
    public-url: ${ATLAS_DB_CONSOLE_URL:}
    connect-token: ${ATLAS_DB_CONSOLE_CONNECT_TOKEN:}
  proxmox:
    # Autopilot ISOLATED placement (optional). Secret proxmox.api.token via Secrets UI.
    api-url: ${ATLAS_PROXMOX_API_URL:}
    node: ${ATLAS_PROXMOX_NODE:}
    template-vmid: ${ATLAS_PROXMOX_TEMPLATE_VMID:}
    target-node: ${ATLAS_PROXMOX_TARGET_NODE:}
    storage: ${ATLAS_PROXMOX_STORAGE:}
    bridge: ${ATLAS_PROXMOX_BRIDGE:}
    ssh-user: ${ATLAS_PROXMOX_SSH_USER:atlas}
    ssh-port: ${ATLAS_PROXMOX_SSH_PORT:22}
    clone-enabled: ${ATLAS_PROXMOX_CLONE_ENABLED:false}
    reuse-enabled: ${ATLAS_PROXMOX_REUSE_ENABLED:true}
    reuse-tag: ${ATLAS_PROXMOX_REUSE_TAG:}
    default-guest-ip: ${ATLAS_PROXMOX_DEFAULT_GUEST_IP:}
    guest-ready-timeout-seconds: ${ATLAS_PROXMOX_GUEST_READY_TIMEOUT_SECONDS:120}
    guest-ready-poll-interval-ms: ${ATLAS_PROXMOX_GUEST_READY_POLL_INTERVAL_MS:3000}
    insecure-tls: ${ATLAS_PROXMOX_INSECURE_TLS:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.atlas: INFO
