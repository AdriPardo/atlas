spring:
  application:
    name: atlas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${ATLAS_DB_USERNAME:atlas}
    password: ${ATLAS_DB_PASSWORD:atlas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

atlas:
  security:
    jwt:
      secret: ${ATLAS_JWT_SECRET:change-me-change-me-change-me-change-me-32chars}
      expiration-seconds: ${ATLAS_JWT_EXPIRATION:86400}
    cors:
      allowed-origins: ${ATLAS_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
    admin:
      username: ${ATLAS_ADMIN_USERNAME:admin}
      password: ${ATLAS_ADMIN_PASSWORD:ChangeMe123!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.atlas: INFO
