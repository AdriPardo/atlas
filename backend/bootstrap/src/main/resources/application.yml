spring:
  application:
    name: atlas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${ATLAS_DB_USERNAME:atlas}
    password: ${ATLAS_DB_PASSWORD:atlas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

atlas:
  security:
    jwt:
      secret: ${ATLAS_JWT_SECRET:change-me-change-me-change-me-change-me-32chars}
      expiration-seconds: ${ATLAS_JWT_EXPIRATION:86400}
    cors:
      allowed-origins: ${ATLAS_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
    admin:
      username: ${ATLAS_ADMIN_USERNAME:admin}
      password: ${ATLAS_ADMIN_PASSWORD:ChangeMe123!}
    authentik:
      # Trust X-authentik-* ForwardAuth headers only when enabled (docker/prod behind Traefik).
      enabled: ${ATLAS_AUTHENTIK_ENABLED:false}
      # Group name substring → ADMIN; everyone else → OPERATOR (Authentik: pipe-separated groups).
      admin-group: ${ATLAS_AUTHENTIK_ADMIN_GROUP:Atlas Admins}
  worker:
    # Same process as API for MVP. Split later with SPRING_PROFILES_ACTIVE=worker + atlas.worker.enabled=true only on worker.
    enabled: ${ATLAS_WORKER_ENABLED:true}
    poll-interval-ms: ${ATLAS_WORKER_POLL_INTERVAL_MS:2000}
    batch-size: ${ATLAS_WORKER_BATCH_SIZE:5}
    id: ${ATLAS_WORKER_ID:atlas-worker}
  workspace:
    dir: ${ATLAS_WORKSPACE_DIR:${java.io.tmpdir}/atlas-workspaces}
  docker:
    host: ${ATLAS_DOCKER_HOST:}
  secrets:
    master-key: ${ATLAS_SECRETS_MASTER_KEY:}
  adapters:
    real-enabled: ${ATLAS_ADAPTERS_REAL_ENABLED:true}
  observability:
    grafana-base-url: ${ATLAS_GRAFANA_BASE_URL:}
    loki-base-url: ${ATLAS_LOKI_BASE_URL:}
  webhooks:
    rate-limit:
      max-requests: ${ATLAS_WEBHOOK_RATE_MAX:30}
      window-seconds: ${ATLAS_WEBHOOK_RATE_WINDOW_SECONDS:60}
  retention:
    enabled: ${ATLAS_RETENTION_ENABLED:true}
    jobs-days: ${ATLAS_RETENTION_JOBS_DAYS:30}
    pipeline-runs-days: ${ATLAS_RETENTION_PIPELINE_RUNS_DAYS:30}
    cron: ${ATLAS_RETENTION_CRON:0 0 3 * * *}
  backup:
    enabled: ${ATLAS_BACKUP_ENABLED:true}
    dir: ${ATLAS_BACKUP_DIR:/var/lib/atlas/backups}
    keep-count: ${ATLAS_BACKUP_KEEP_COUNT:7}
    cron: ${ATLAS_BACKUP_CRON:0 30 2 * * *}
    pg-dump-binary: ${ATLAS_BACKUP_PG_DUMP_BINARY:pg_dump}
  networking:
    traefik-cert-resolver: ${ATLAS_TRAEFIK_CERT_RESOLVER:letsencrypt}
    traefik-backend-port: ${ATLAS_TRAEFIK_BACKEND_PORT:80}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.atlas: INFO
