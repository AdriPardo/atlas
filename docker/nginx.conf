server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Authentik ForwardAuth identity headers (injected by Traefik) to Atlas API
        proxy_set_header X-authentik-username $http_x_authentik_username;
        proxy_set_header X-authentik-groups $http_x_authentik_groups;
        proxy_set_header X-authentik-email $http_x_authentik_email;
        proxy_set_header X-authentik-name $http_x_authentik_name;
        proxy_set_header X-authentik-uid $http_x_authentik_uid;
        proxy_set_header X-authentik-jwt $http_x_authentik_jwt;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
